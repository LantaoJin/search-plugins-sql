plugins {
    id 'java'
    id 'java-library'
    id 'application'
    id "io.freefair.lombok"
    id 'com.diffplug.spotless'
}

group = 'org.opensearch'

// Application configuration
application {
    mainClass = 'org.opensearch.sql.NativeEngineDemo'
}

dependencies {
    implementation project(':core')
    implementation 'org.apache.calcite:calcite-server:1.41.0'
    api ('io.substrait:isthmus:0.68.0') {
        exclude group: 'org.apache.calcite', module: 'calcite-core'
        exclude group: 'org.apache.calcite', module: 'calcite-linq4j'
        exclude group: 'org.apache.calcite', module: 'calcite-server'
        exclude group: 'com.fasterxml.jackson', module: 'jackson-bom'
    }
    annotationProcessor 'org.immutables:value:2.8.8'
    compileOnly 'org.immutables:value-annotations:2.8.8'

    testImplementation('org.junit.jupiter:junit-jupiter-api:5.9.3')
    testImplementation('org.junit.jupiter:junit-jupiter-params:5.9.3')
    testRuntimeOnly('org.junit.jupiter:junit-jupiter-engine:5.9.3')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher:1.9.3')
}

configurations.all {
    resolutionStrategy.force "org.slf4j:slf4j-api:2.0.17"
}

// C++ build task
task buildCpp(type: Exec) {
    description = 'Build C++ native library'
    
    def cppDir = file("${rootProject.projectDir}/cpp")
    def buildDir = file("${cppDir}/build")
    def libDir = file("${project.buildDir}/libs")
    
    // Create build directories
    doFirst {
        buildDir.mkdirs()
        libDir.mkdirs()
    }
    
    workingDir buildDir
    
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'cmake', '..', '&&', 'cmake', '--build', '.', '--config', 'Release'
    } else {
        commandLine 'sh', '-c', 'cmake .. && make -j$(nproc)'
    }
    
    // Copy generated library files
    doLast {
        def libFile
        if (System.getProperty('os.name').toLowerCase().contains('windows')) {
            libFile = file("${buildDir}/lib/Release/opensearch-sql-native.dll")
        } else if (System.getProperty('os.name').toLowerCase().contains('mac')) {
            libFile = file("${buildDir}/lib/opensearch-sql-native.dylib")
        } else {
            libFile = file("${buildDir}/lib/opensearch-sql-native.so")
        }
        
        if (libFile.exists()) {
            copy {
                from libFile
                into libDir
            }
            println "Native library copied to: ${libDir}"
        } else {
            println "Warning: Native library not found at ${libFile}"
        }
    }
}

// Clean C++ build files
task cleanCpp(type: Delete) {
    delete "${rootProject.projectDir}/cpp/build"
}

// Integrate C++ build into Java build process
compileJava.dependsOn buildCpp
clean.dependsOn cleanCpp

// Add native library to test classpath
test {
    systemProperty 'java.library.path', "${project.buildDir}/libs"
    useJUnitPlatform()
}

// Configure run task
run {
    systemProperty 'java.library.path', "${project.buildDir}/libs"
    dependsOn buildCpp
}

spotless {
    java {
        target fileTree('.') {
            include '**/*.java'
            exclude '**/build/**', '**/build-*/**'
        }
        importOrder()
        licenseHeader("/*\n" +
                " * Copyright OpenSearch Contributors\n" +
                " * SPDX-License-Identifier: Apache-2.0\n" +
                " */\n\n")
                .onlyIfContentMatches("^((?!\\(original license below\\))[\\s\\S])*\$")
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
        googleJavaFormat('1.17.0').reflowLongStrings().groupArtifact('com.google.googlejavaformat:google-java-format')
    }
}

test {
    maxParallelForks = Runtime.runtime.availableProcessors()
    useJUnitPlatform()
    testLogging {
        events "skipped", "failed"
        exceptionFormat "full"
    }
}